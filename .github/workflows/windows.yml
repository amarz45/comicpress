name: Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  WINSPARKLE_VERSION: "0.9.4"

jobs:
  # Builds and tests every push, pull request and release tag. On tags, the
  # bundled application is also passed on to the release job.
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git curl tar unzip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-gtest

      - name: Check tag matches project version
        id: version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n "s/^    version: '\(.*\)',$/\1/p" meson.build)
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match meson.build version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install PDFium
        run: |
          curl -L -o pdfium.tgz \
            https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz
          mkdir pdfium && tar -xzf pdfium.tgz -C pdfium
          cp -r pdfium/include/* /ucrt64/include/
          cp pdfium/bin/pdfium.dll /ucrt64/bin/
          cp pdfium/lib/pdfium.dll.lib /ucrt64/lib/libpdfium.dll.a

      - name: Install WinSparkle
        run: |
          curl -L -o winsparkle.zip \
            "https://github.com/vslavik/winsparkle/releases/download/v${WINSPARKLE_VERSION}/WinSparkle-${WINSPARKLE_VERSION}.zip"
          unzip -q winsparkle.zip
          winsparkle="WinSparkle-${WINSPARKLE_VERSION}"
          cp "$winsparkle/include/winsparkle.h" \
             "$winsparkle/include/winsparkle-version.h" /ucrt64/include/
          cp "$winsparkle/x64/Release/WinSparkle.dll" /ucrt64/bin/
          cp "$winsparkle/x64/Release/WinSparkle.lib" \
             /ucrt64/lib/libWinSparkle.dll.a

      - name: Build
        run: |
          meson setup build --buildtype=release -Dtests=enabled
          meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Bundle
        if: github.ref_type == 'tag'
        run: bash packaging/windows/bundle.sh build "$PWD/dist"

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: dist
          path: dist

  # Signs and publishes the release. A separate job so that only release tags
  # enter the `release` environment and get its signing secrets.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      length: ${{ steps.sign.outputs.length }}
      signature: ${{ steps.sign.outputs.signature }}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: curl unzip

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download WinSparkle
        run: |
          curl -L -o winsparkle.zip \
            "https://github.com/vslavik/winsparkle/releases/download/v${WINSPARKLE_VERSION}/WinSparkle-${WINSPARKLE_VERSION}.zip"
          unzip -q winsparkle.zip

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\comicpress.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          iscc=$(find "/c/Program Files" "/c/Program Files (x86)" \
              -maxdepth 2 -name ISCC.exe | head -1)
          test -n "$iscc" || { echo "ISCC.exe not found" >&2; exit 1; }
          "$iscc" //DDistDir="$(cygpath -w "$PWD/dist")" \
                  //DOutputDir="$(cygpath -w "$PWD")" \
                  packaging/windows/comicpress.iss

      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\comicpress-${{ needs.build.outputs.version }}-windows-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign update
        id: sign
        env:
          WINSPARKLE_PRIVATE_KEY: ${{ secrets.WINSPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          printf '%s' "$WINSPARKLE_PRIVATE_KEY" > private.key
          installer="comicpress-${VERSION}-windows-x64.exe"
          test -f "$installer"
          sig=$("WinSparkle-${WINSPARKLE_VERSION}/bin/winsparkle-tool.exe" \
              sign -f private.key "$installer")
          rm -f private.key
          test -n "$sig"
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -c %s "$installer")" >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "comicpress-$env:VERSION-windows-x64.exe" `
            --title $env:VERSION --generate-notes

  appcast:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Write appcast
        env:
          VERSION: ${{ needs.build.outputs.version }}
          LENGTH: ${{ needs.release.outputs.length }}
          SIGNATURE: ${{ needs.release.outputs.signature }}
        run: |
          mkdir -p docs
          cat > docs/appcast.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>Comicpress</title>
                  <description>Updates to Comicpress</description>
                  <language>en</language>
                  <item>
                      <title>Version ${VERSION}</title>
                      <sparkle:version>${VERSION}</sparkle:version>
                      <pubDate>$(date -R)</pubDate>
                      <enclosure url="https://github.com/amarz45/comicpress/releases/download/v${VERSION}/comicpress-${VERSION}-windows-x64.exe"
                                 length="${LENGTH}"
                                 type="application/octet-stream"
                                 sparkle:edSignature="${SIGNATURE}" />
                  </item>
              </channel>
          </rss>
          EOF

      - name: Commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git diff --staged --quiet || git commit -m "Update appcast for ${VERSION}"
          git push origin master
